<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextMail - Instant Temporary Email</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">
            <svg class="logo-icon" width="32" height="32" viewBox="0 0 24 24" fill="none">
                <path d="M3.5 13.5L8 10L12.5 14L20.5 7" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M16 7H20.5V11.5" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 17.5L9.5 21L5 17L3.5 18.5" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>NextMail</span>
        </div>
        <div class="nav-right">
            <button class="lang-btn">English ▾</button>
        </div>
    </header>

    <main class="main-container">
        <section class="hero-section">
            <div class="badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                Instant Temporary Email
            </div>
            <h1>Instant Temporary Email</h1>
            <p class="subtitle">Get a disposable email address in seconds. Keep your real inbox safe, private and spam-free.</p>
            
            <div class="email-box">
                <div class="email-display">
                    <span id="email-address">n4072bc52cd@nextmail.io</span>
                </div>
                <div class="action-buttons">
                    <button class="btn copy-btn" onclick="copyEmail()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy
                    </button>
                    <button class="btn new-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        New Email
                    </button>
                </div>
            </div>

            <div class="timer-status">
                <span class="pulse-dot"></span>
                <span>Active for: <strong>01:34:18</strong></span>
            </div>
        </section>

        <section class="inbox-section">
            <div class="inbox-header">
                <h2>Live Inbox</h2>
                <button class="refresh-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    Refresh
                </button>
            </div>
            <div class="inbox-content">
                <p class="no-messages">No messages yet. Incoming mail will appear here automatically.</p>
            </div>
        </section>
    </main>
</body>
</html>
