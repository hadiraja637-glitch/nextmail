<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login - NextMail</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body>
<header class="navbar"><div class="logo" onclick="location.href='index.html'" style="cursor:pointer"><span>NextMail</span></div><div class="nav-right"><a href="index.html" class="login-btn">Back to Home</a></div></header>
<main class="auth-container" style="display:flex;justify-content:center;align-items:center;min-height:80vh;padding:20px"><div class="auth-card" style="max-width:420px;width:100%;padding:40px">
<h2 style="text-align:center;color:#fff">Welcome Back</h2><p style="text-align:center;color:#94a3b8">Sign in to save your NextMail account and manage Pro.</p>
<button id="googleBtn" class="google-btn" style="width:100%;padding:12px;margin:20px 0;cursor:pointer">Continue with Google</button>
<form id="loginForm"><input id="email" type="email" placeholder="Email Address" required style="width:100%;padding:12px;margin:8px 0"><input id="password" type="password" placeholder="Password" required style="width:100%;padding:12px;margin:8px 0"><button type="submit" style="width:100%;padding:12px;cursor:pointer">Sign In</button></form>
<button id="signupBtn" style="width:100%;padding:12px;margin-top:10px;cursor:pointer">Create Account</button><p id="status" style="text-align:center;color:#94a3b8;margin-top:15px"></p>
</div></main>
<script>
(async()=>{
 const c=await fetch("/api/config").then(r=>r.json());
 const status=document.getElementById("status");
 if(!c.supabase_url||!c.supabase_publishable_key){status.textContent="Authentication is not configured on Vercel yet.";return;}
 const sb=window.supabase.createClient(c.supabase_url,c.supabase_publishable_key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 window.nextmailSupabase=sb;
 googleBtn.onclick=async()=>{const r=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+"/index.html"}});if(r.error)status.textContent=r.error.message;};
 loginForm.onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});status.textContent=r.error?r.error.message:"Signed in successfully.";if(!r.error)setTimeout(()=>location.href="index.html",500);};
 signupBtn.onclick=async()=>{const r=await sb.auth.signUp({email:email.value.trim(),password:password.value});status.textContent=r.error?r.error.message:"Account created. Check your email if confirmation is enabled.";};
})();
</script></body></html>
